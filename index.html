<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form P2H Crimping Machine</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: auto; }
    .hidden { display: none; }
    label { display: block; margin-top: 10px; }
    input, select, textarea { width: 100%; padding: 5px; margin-top: 5px; }
    button { margin-top: 15px; padding: 10px 20px; }
  </style>
</head>
<body>

  <h2>Login Operator</h2>
  <div id="loginForm">
    <label>Username:
      <input type="text" id="username" required>
    </label>
    <label>Password:
      <input type="password" id="password" required>
    </label>
    <button onclick="login()">Login</button>
  </div>

  <div id="p2hForm" class="hidden">
    <h2>Form P2H Crimping Machine</h2>
    <label>Nama Operator:
      <input type="text" id="operator">
    </label>
    <label>ID Mesin:
      <input type="text" id="idMesin">
    </label>
    <label>Tanggal Pemeriksaan:
      <input type="date" id="tanggal">
    </label>

    <label>Upload Foto Mesin:
      <input type="file" accept="image/*" id="fotoMesin">
    </label>

    <h3>Checklist Harian</h3>

    <label>Power Supply:
      <select>
        <option>OK</option>
        <option>Perlu Tindakan</option>
      </select>
    </label>

    <label>Hydraulic Unit:
      <select>
        <option>OK</option>
        <option>Perlu Tindakan</option>
      </select>
    </label>

    <label>Crimp Dies:
      <select>
        <option>OK</option>
        <option>Perlu Tindakan</option>
      </select>
    </label>

    <label>Cylinder Movement:
      <select>
        <option>OK</option>
        <option>Perlu Tindakan</option>
      </select>
    </label>

    <label>Control Panel:
      <select>
        <option>OK</option>
        <option>Perlu Tindakan</option>
      </select>
    </label>

    <label>Grease Point:
      <select>
        <option>OK</option>
        <option>Perlu Tindakan</option>
      </select>
    </label>

    <label>Emergency Stop:
      <select>
        <option>OK</option>
        <option>Perlu Tindakan</option>
      </select>
    </label>

    <button onclick="submitForm()">Submit</button>
  </div>

  <script>
    function login() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      // Simulasi login sederhana (gunakan autentikasi server di aplikasi nyata)
      if (username === "operator" && password === "1234") {
        document.getElementById("loginForm").style.display = "none";
        document.getElementById("p2hForm").classList.remove("hidden");
      } else {
        alert("Username atau password salah!");
      }
    }

    function submitForm() {
      alert("Form berhasil dikirim (simulasi).");
    }
  </script>
</body>
</html>
