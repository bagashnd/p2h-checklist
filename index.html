<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form P2H Crimping Machine</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      background: #ffffff;
      max-width: 600px;
      width: 100%;
      margin: 40px auto;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
    }

    .logo {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .logo img {
      height: 60px;
    }

    h2, h3 {
      margin-top: 0;
      font-weight: 600;
      color: #333;
      text-align: center;
    }

    label {
      display: block;
      margin-top: 15px;
      color: #444;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      background-color: #fdfdfd;
    }

    button {
      width: 100%;
      background: #007bff;
      color: white;
      padding: 12px;
      margin-top: 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: #0056b3;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">
      <img src="logo.png" alt="Logo Perusahaan">
    </div>

    <h2>Login Operator</h2>
    <div id="loginForm">
      <label>Username:
        <input type="text" id="username" required>
      </label>
      <label>Password:
        <input type="password" id="password" required>
      </label>
      <button onclick="login()">Login</button>
    </div>

    <div id="p2hForm" class="hidden">
      <h2>Form P2H Crimping Machine</h2>
      <label>Nama Operator:
        <input type="text" id="operator">
      </label>
      <label>ID Mesin:
        <input type="text" id="idMesin">
      </label>
      <label>Tanggal Pemeriksaan:
        <input type="date" id="tanggal">
      </label>

      <label>Upload Foto Mesin:
        <input type="file" accept="image/*" id="fotoMesin">
      </label>

      <h3>Checklist Harian</h3>

      <label>Power Supply:
        <select>
          <option>OK</option>
          <option>Perlu Tindakan</option>
        </select>
      </label>

      <label>Hydraulic Unit:
        <select>
          <option>OK</option>
          <option>Perlu Tindakan</option>
        </select>
      </label>

      <label>Crimp Dies:
        <select>
          <option>OK</option>
          <option>Perlu Tindakan</option>
        </select>
      </label>

      <label>Cylinder Movement:
        <select>
          <option>OK</option>
          <option>Perlu Tindakan</option>
        </select>
      </label>

      <label>Control Panel:
        <select>
          <option>OK</option>
          <option>Perlu Tindakan</option>
        </select>
      </label>

      <label>Grease Point:
        <select>
          <option>OK</option>
          <option>Perlu Tindakan</option>
        </select>
      </label>

      <label>Emergency Stop:
        <select>
          <option>OK</option>
          <option>Perlu Tindakan</option>
        </select>
      </label>

      <button onclick="submitForm()">Submit</button>
    </div>
  </div>

  <script>
    function login() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      if (username === "operator" && password === "1234") {
        document.getElementById("loginForm").style.display = "none";
        document.getElementById("p2hForm").classList.remove("hidden");
      } else {
        alert("Username atau password salah!");
      }
    }

    function submitForm() {
      alert("Form berhasil dikirim (simulasi).");
    }
  </script>
</body>
</html>
