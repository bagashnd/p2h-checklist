<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checklist P2H Crimping</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100 font-sans">

<!-- Login Page -->
<div id="loginPage" class="min-h-screen flex items-center justify-center">
  <div class="bg-white p-6 rounded-xl shadow-xl w-full max-w-sm">
    <div class="flex justify-center mb-4">
      <img src="logo.png" alt="Logo Perusahaan" class="h-20">
    </div>
    <h2 class="text-xl font-semibold text-center mb-4 text-gray-700">Login Aplikasi P2H</h2>
    <form onsubmit="login(event)" class="space-y-4">
      <input id="username" type="text" placeholder="Username" required class="w-full p-2 border rounded"/>
      <input id="password" type="password" placeholder="Password" required class="w-full p-2 border rounded"/>
      <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Masuk</button>
    </form>
  </div>
</div>

<!-- Main Page -->
<div id="mainPage" class="hidden min-h-screen p-6">
  <div class="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow-lg">
    <div class="text-center mb-6">
      <h1 class="text-xl font-bold flex items-center justify-center gap-2">
        ✅ Checklist P2H Mesin Crimping
      </h1>
    </div>
    <form id="checklistForm" onsubmit="submitToDatabase(event)">
      <div class="grid gap-4">
        <input name="nama" type="text" placeholder="Nama Pemeriksa" required class="p-2 border rounded w-full" />
        <input name="tanggal" type="date" required class="p-2 border rounded w-full" />
        <input name="jam" type="time" required class="p-2 border rounded w-full" />
        <input name="asset" type="text" placeholder="No Asset" required class="p-2 border rounded w-full" />
        <input name="lokasi" type="text" placeholder="Lokasi" required class="p-2 border rounded w-full" />
        <input name="hours_meter" type="number" placeholder="Hours Meter (Jam)" min="0" required class="p-2 border rounded w-full" />
        <input type="file" name="foto_umum" accept="image/*" class="p-2 border rounded w-full" />
      </div>

      <!-- Checklist Container -->
      <div id="checklistContainer" class="mt-6 space-y-4"></div>

      <!-- Submit & Export -->
      <div class="mt-6 flex gap-4 justify-between">
        <button type="submit" class="flex-1 bg-green-600 text-white p-2 rounded hover:bg-green-700">Submit</button>
        <button type="button" onclick="exportToExcel()" class="flex-1 bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Export Excel</button>
      </div>
    </form>
  </div>
</div>

<script>
const checklistItems = [
  { section: "A. PANEL", items: ["Display", "Switch ON/OFF", "Switch Adjuster", "Panel Release", "Panel Crimp", "Cover"] },
  { section: "B. TOOLS", items: ["Swager", "Swager Racks", "Swager Dies (Batu Dash)"] },
  {
    section: "C. MAINTENANCE",
    items: [
      "Cek Oil Level",
      "Greasing Area Dudukan Batu Dash",
      "Power Supply",
      "Cek Function Crimp",
      "Cek Function Release",
      "Putaran motor/pompa searah jarum jam",
      "Suara bising pada motor/pompa",
      "Panas berlebih pada motor/pompa",
      "Cek Oil Leaking Solenoid",
      "Cek Oil Leaking Piping/Hose",
      "Cek Oil leaking Adaptor/Connector",
      "Calibration"
    ]
  }
];

function generateChecklist() {
  const container = document.getElementById("checklistContainer");
  checklistItems.forEach((group, idx) => {
    const sectionDiv = document.createElement("div");
    const sublistId = `sublist-${idx}`;

    sectionDiv.innerHTML = `
      <div class="bg-gray-200 p-3 rounded cursor-pointer flex justify-between items-center" onclick="document.getElementById('${sublistId}').classList.toggle('hidden')">
        <span class="font-semibold text-gray-700">${group.section}</span>
        <span>▼</span>
      </div>
      <div id="${sublistId}" class="space-y-3 mt-2 hidden"></div>
    `;

    const sublist = sectionDiv.querySelector(`#${sublistId}`);

    group.items.forEach(item => {
      const options = ["Suara bising pada motor/pompa", "Panas berlebih pada motor/pompa"].includes(item)
        ? ["Ada", "Tidak Ada"]
        : ["Good", "No"];
      const itemHtml = `
        <div class="border rounded p-3 bg-gray-50">
          <label class="block font-medium text-sm mb-1">${item}</label>
          <div class="flex gap-4 mb-2">
            ${options.map(opt => `
              <label class="text-sm flex items-center gap-1">
                <input type="radio" name="${item}" value="${opt}" required /> ${opt}
              </label>`).join("")}
          </div>
          <input type="text" name="${item}_remark" placeholder="Catatan (opsional)" class="text-sm w-full border p-1 rounded" />
        </div>
      `;
      sublist.innerHTML += itemHtml;
    });

    container.appendChild(sectionDiv);
  });
}

function login(event) {
  event.preventDefault();
  const user = document.getElementById("username").value;
  const pass = document.getElementById("password").value;
  if (user === "admin" && pass === "1234") {
    document.getElementById("loginPage").classList.add("hidden");
    document.getElementById("mainPage").classList.remove("hidden");
    generateChecklist();
  } else {
    alert("Username atau password salah");
  }
}

function exportToExcel() {
  const form = document.getElementById("checklistForm");
  const data = [["Item", "Status", "Remark"]];
  checklistItems.forEach(group => {
    group.items.forEach(item => {
      const val = form.querySelector(`input[name="${item}"]:checked`)?.value || "";
      const remark = form.querySelector(`input[name="${item}_remark"]`)?.value || "";
      data.push([item, val, remark]);
    });
  });
  const ws = XLSX.utils.aoa_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Checklist");
  XLSX.writeFile(wb, "Checklist_P2H.xlsx");
}

function submitToDatabase(event) {
  event.preventDefault();
  const form = document.getElementById("checklistForm");
  const formData = {
    nama: form.nama.value,
    tanggal: form.tanggal.value,
    jam: form.jam.value,
    asset: form.asset.value,
    lokasi: form.lokasi.value,
    hours_meter: form.hours_meter.value,
    checklist: []
  };

  for (const group of checklistItems) {
    for (const item of group.items) {
      const status = form.querySelector(`input[name="${item}"]:checked`);
      if (!status) {
        alert(`Checklist '${item}' belum diisi.`);
        return;
      }
      const remark = form.querySelector(`input[name="${item}_remark"]`)?.value || "";
      formData.checklist.push({ item, status: status.value, remark });
    }
  }

  fetch("https://your-api.com/api/checklist", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(formData)
  })
  .then(res => {
    if (res.ok) {
      alert("Checklist berhasil disimpan!");
      exportToExcel();
    } else {
      alert("Gagal menyimpan checklist.");
    }
  })
  .catch(err => {
    console.error(err);
    alert("Terjadi kesalahan koneksi.");
  });
}
</script>
</body>
</html>
