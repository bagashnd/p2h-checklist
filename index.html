<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checklist P2H Mesin Crimping</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .section-header {
      cursor: pointer;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

<!-- Login Page -->
<div id="loginPage" class="w-full max-w-sm p-6 bg-white rounded-lg shadow-md">
  <div class="flex justify-center mb-6">
    <img src="logo.png" alt="Logo Perusahaan" class="h-20">
  </div>
  <h2 class="text-center text-xl font-semibold text-gray-700 mb-4">Login Checklist P2H</h2>
  <form onsubmit="login(event)">
    <input id="username" type="text" placeholder="Username" required class="mb-3 w-full px-3 py-2 border rounded">
    <input id="password" type="password" placeholder="Password" required class="mb-4 w-full px-3 py-2 border rounded">
    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded">Masuk</button>
  </form>
</div>

<!-- Main Checklist Page -->
<div id="mainPage" class="hidden w-full max-w-3xl bg-white p-6 rounded-lg shadow-md overflow-y-auto">
  <h1 class="text-lg font-bold text-center mb-6 flex items-center justify-center gap-2">
    <img src="https://cdn-icons-png.flaticon.com/512/190/190411.png" alt="Checklist Icon" class="w-6 h-6">
    Checklist P2H Mesin Crimping
  </h1>
  <form id="checklistForm" onsubmit="submitToDatabase(event)">
    <div class="grid gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nama Pemeriksa</label>
        <input name="nama" type="text" required class="p-2 border rounded w-full" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Model</label>
        <input name="model" type="text" required class="p-2 border rounded w-full" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Serial Number</label>
        <input name="serial" type="text" required class="p-2 border rounded w-full" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal</label>
        <input name="tanggal" type="date" required class="p-2 border rounded w-full" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Jam</label>
        <input name="jam" type="time" required class="p-2 border rounded w-full" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">No Asset</label>
        <input name="asset" type="text" required class="p-2 border rounded w-full" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Lokasi</label>
        <input name="lokasi" type="text" required class="p-2 border rounded w-full" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Hours Meter (Jam)</label>
        <input name="hours_meter" type="number" min="0" required class="p-2 border rounded w-full" />
      </div>
    </div>

    <div id="checklistContainer" class="mt-6 space-y-4"></div>

    <div class="mt-6">
      <label class="block text-sm font-medium mb-1">Upload Foto Pemeriksaan:</label>
      <input type="file" name="foto_umum" accept="image/*" class="p-2 border rounded w-full" />
    </div>

    <div class="mt-6 flex gap-4 justify-between">
      <button type="submit" class="flex-1 bg-green-600 text-white p-2 rounded hover:bg-green-700">Submit</button>
      <button type="button" onclick="exportToExcel()" class="flex-1 bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Export Excel</button>
    </div>
  </form>
</div>

<script>
const checklistItems = [
  { section: "A. PANEL", items: ["Display", "Switch ON/OFF", "Switch Adjuster", "Panel Release", "Panel Crimp", "Cover"] },
  { section: "B. TOOLS", items: ["Swager", "Swager Racks", "Swager Dies (Batu Dash)"] },
  { section: "C. MAINTENANCE", items: [
    "Cek Oil Level",
    "Greasing dan Bersihkan Area Dudukan Batu Dash",
    "Power Supply",
    "Cek Function Crimp",
    "Cek Function Release",
    "Putaran motor/pompa searah jarum jam",
    "Suara bising pada motor/pompa",
    "Panas berlebih pada motor/pompa",
    "Cek Oil Leaking Solenoid",
    "Cek Oil Leaking Piping/Hose",
    "Cek Oil leaking Adaptor/Connector",
    "Calibration"]
  }
];

function generateChecklist() {
  const container = document.getElementById('checklistContainer');
  const yesNoItems = [
    "Cek Oil Level",
    "Greasing Area Dudukan Batu Dash",
    "Power Supply",
    "Cek Function Crimp",
    "Cek Function Release",
    "Putaran motor/pompa searah jarum jam",
    "Cek Oil Leaking Solenoid",
    "Cek Oil Leaking Piping/Hose",
    "Cek Oil leaking Adaptor/Connector",
    "Calibration"
  ];

  checklistItems.forEach((group, idx) => {
    const section = document.createElement('div');
    section.className = 'bg-white border rounded-lg shadow-sm overflow-hidden';

    const sectionHeader = document.createElement('div');
    sectionHeader.className = 'section-header text-md font-semibold text-blue-700 px-4 py-3 bg-gray-100 border-b hover:bg-blue-50 flex justify-between items-center';
    sectionHeader.innerHTML = `
      <span>${group.section}</span>
      <svg id="icon-${idx}" class="w-5 h-5 transition-transform duration-200 transform" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
      </svg>
    `;
    sectionHeader.onclick = () => {
      const sublist = document.getElementById(`sublist-${idx}`);
      const icon = document.getElementById(`icon-${idx}`);
      sublist.classList.toggle('hidden');
      icon.classList.toggle('rotate-180');
    };

    const sublist = document.createElement('div');
    sublist.id = `sublist-${idx}`;
    sublist.className = 'p-4 space-y-4 hidden';

    group.items.forEach(item => {
      const itemDiv = document.createElement('div');
      itemDiv.className = 'bg-gray-50 border rounded-lg p-3';

      let options = item.includes("bising") || item.includes("Panas")
        ? ['Ada', 'Tidak Ada']
        : yesNoItems.includes(item)
          ? ['Yes', 'No']
          : ['Good', 'No'];

      itemDiv.innerHTML = `
        <div class="flex flex-col gap-2">
          <span class="font-medium text-sm text-gray-800">${item}</span>
          <div class="flex gap-4 flex-wrap">
            ${options.map(opt => `
              <label class="inline-flex items-center text-sm">
                <input type="radio" name="${item}" value="${opt}" class="mr-2"> ${opt}
              </label>
            `).join('')}
          </div>
          <input type="text" name="${item}_remark" placeholder="Catatan (opsional)" class="border rounded px-3 py-1 text-sm w-full">
        </div>
      `;
      sublist.appendChild(itemDiv);
    });

    section.appendChild(sectionHeader);
    section.appendChild(sublist);
    container.appendChild(section);
  });
}

function exportToExcel() {
  const form = document.getElementById("checklistForm");
  const data = [
    ["Nama Pemeriksa", form.nama.value],
    ["Model", form.model.value],
    ["Serial Number", form.serial.value],
    ["Tanggal", form.tanggal.value],
    ["Jam", form.jam.value],
    ["No Asset", form.asset.value],
    ["Lokasi", form.lokasi.value],
    ["Hours Meter", form.hours_meter.value],
    [],
    ["Item", "Kondisi", "Remark"]
  ];

  checklistItems.forEach(group => {
    group.items.forEach(item => {
      const radios = form.querySelectorAll(`input[name='${item}']`);
      const selected = [...radios].find(r => r.checked)?.value || "";
      const remark = form.querySelector(`input[name='${item}_remark']`)?.value || "";
      data.push([item, selected, remark]);
    });
  });

  const ws = XLSX.utils.aoa_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Checklist");
  XLSX.writeFile(wb, "checklist_p2h.xlsx");
}

function login(event) {
  event.preventDefault();
  const user = document.getElementById("username").value;
  const pass = document.getElementById("password").value;
  if (user === "admin" && pass === "1234") {
    document.getElementById("loginPage").classList.add("hidden");
    document.getElementById("mainPage").classList.remove("hidden");
  } else {
    alert("Username atau password salah");
  }
}

function showSuccessNotification(message) {
  const notif = document.createElement('div');
  notif.className = 'fixed bottom-6 right-6 bg-green-500 text-white px-4 py-2 rounded shadow-lg z-50';
  notif.textContent = message;
  document.body.appendChild(notif);
  setTimeout(() => notif.remove(), 3000);
}

function submitToDatabase(event) {
  event.preventDefault();

  const form = document.getElementById("checklistForm");
  const formData = {
    nama: form.nama.value,
    model: form.model.value,
    serial: form.serial.value,
    tanggal: form.tanggal.value,
    jam: form.jam.value,
    asset: form.asset.value,
    lokasi: form.lokasi.value,
    hours_meter: form.hours_meter.value,
    checklist: []
  };

  for (const group of checklistItems) {
    for (const item of group.items) {
      const radios = form.querySelectorAll(`input[name='${item}']`);
      const selected = [...radios].find(r => r.checked)?.value;
      if (!selected) {
        alert(`Checklist '${item}' belum diisi.`);
        return;
      }
      const remark = form.querySelector(`input[name='${item}_remark']`)?.value || "";
      formData.checklist.push({ item, status: selected, remark });
    }
  }

  fetch("https://your-api-server.com/api/checklist", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(formData)
  })
  .then(res => {
    if (res.ok) {
      showSuccessNotification("Checklist berhasil disimpan!");
      exportToExcel();
    } else {
      alert("Gagal menyimpan checklist.");
    }
  })
  .catch(err => {
    console.error(err);
    alert("Terjadi kesalahan koneksi.");
  });
}

window.onload = generateChecklist;
</script>

</body>
</html>
