<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checklist P2H Crimping</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script>
    const checklistItems = [
      { section: "DISPLAY", items: ["Display"] },
      { section: "SWITCH PANEL", items: ["Switch ON/OFF", "Switch Adjuster", "Panel Release", "Panel Crimp"] },
      { section: "COVER", items: ["Swager", "Swager Racks", "Swager Dies (Batu Dash)"] },
      { section: "CEK OIL", items: ["Cek Oil Level"] },
      { section: "GREASING", items: ["Area Dudukan Batu Dash"] },
      { section: "ELECTRICAL", items: ["Power"] },
      { section: "MECHANICAL", items: [
        "Cek Function Crimp", "Cek Function Release", "Putaran Motor searah jarum jam",
        "Suara bising motor", "Panas berlebih motor"] },
      { section: "CEK OIL LEAKING", items: ["Solenoid", "Piping/Hose", "Adapter/Connector"] },
      { section: "CALIBRATION", items: ["Calibration"] }
    ];

    function generateChecklist() {
      const container = document.getElementById('checklistContainer');
      checklistItems.forEach(group => {
        const section = document.createElement('h3');
        section.textContent = group.section;
        section.className = 'text-lg font-semibold mt-4';
        container.appendChild(section);

        group.items.forEach(item => {
          const div = document.createElement('div');
          div.className = 'mb-2';
          div.innerHTML = `
            <label class="block font-medium">${item}</label>
            <div class="flex items-center gap-2">
              <label><input type="radio" name="${item}" value="GOOD" required> Good</label>
              <label><input type="radio" name="${item}" value="NO"> No</label>
              <input type="text" name="${item}_remark" placeholder="Remark" class="border p-1 w-1/2">
            </div>`;
          container.appendChild(div);
        });
      });
    }

    function exportToExcel() {
      const form = document.getElementById("checklistForm");
      const data = [
        ["Item", "Kondisi", "Remark"]
      ];
      checklistItems.forEach(group => {
        group.items.forEach(item => {
          const radios = form.querySelectorAll(`input[name='${item}']`);
          const selected = [...radios].find(r => r.checked)?.value || "";
          const remark = form.querySelector(`input[name='${item}_remark']`)?.value || "";
          data.push([item, selected, remark]);
        });
      });

      const ws = XLSX.utils.aoa_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Checklist");
      XLSX.writeFile(wb, "checklist_p2h.xlsx");
    }

    window.onload = generateChecklist;
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 p-4">
  <div class="max-w-2xl mx-auto bg-white shadow p-6 rounded-xl">
    <h1 class="text-xl font-bold mb-4">Checklist P2H Mesin Crimping</h1>
    <form id="checklistForm" onsubmit="event.preventDefault(); exportToExcel();">
      <div class="mb-4">
        <label class="block">Nama Pemeriksa: <input type="text" name="nama" required class="border w-full p-2"></label>
      </div>
      <div class="mb-4">
        <label class="block">Tanggal: <input type="date" name="tanggal" required class="border w-full p-2"></label>
      </div>
      <div class="mb-4">
        <label class="block">No Asset: <input type="text" name="asset" required class="border w-full p-2"></label>
      </div>
      <div class="mb-4">
        <label class="block">Lokasi: <input type="text" name="lokasi" required class="border w-full p-2"></label>
      </div>

      <div id="checklistContainer"></div>

      <div class="mt-6 mb-4">
        <label class="block font-medium mb-2">Upload Foto (Opsional)</label>
        <input type="file" name="foto_umum" accept="image/*" class="border p-2 w-full">
      </div>

      <div class="mt-6">
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">Export ke Excel</button>
      </div>
    </form>
  </div>
</body>
</html>
